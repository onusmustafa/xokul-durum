<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="xokul sistem durumu: mobil uygulama, web paneli, bildirimler ve diğer servislerin anlık durumu." />
    <title>xokul | Sistem durumu</title>
    <!--
      xokul durum sayfası (durum.xokul.co). Tek dosya, dış bağımlılık yok.

      İki kaynaktan beslenir:
        durum.json   ELLE yönetilir (bu depoda, main dalı): bakım, mesaj,
                     planlı bakımlar, olay kayıtları, bileşen durumu.
                     Mobil uygulama ve web paneli de bakım ekranı için bunu okur.
        gecmis.json  OTOMATİK yazılır (veri dalı): GitHub 5 dakikada bir
                     sistemleri yoklar (yokla.mjs). 90 günlük çubuklar buradan.

      Biçim ve yönetim: README.md
    -->
    <style>
      :root {
        --bg: #faf6f3;
        --card: #ffffff;
        --fg: #38302b;
        --muted: #9c8b7f;
        --border: #eee4dd;
        --primary: #ff7e5f;
        --ok: #1faa6b;
        --ok-soft: #e4f6ed;
        --warn: #e6a100;
        --warn-soft: #fdf3d7;
        --bad: #e5484d;
        --bad-soft: #fde8e8;
        --maint: #ff7e5f;
        --maint-soft: #ffede6;
        --none: #e3dad3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --card: #232224;
          --fg: #f2e9e4;
          --muted: #b9aaa0;
          --border: #353235;
          --ok-soft: #173326;
          --warn-soft: #3a3013;
          --bad-soft: #3d1c1e;
          --maint-soft: #513835;
          --none: #3a3739;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          Outfit,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .sayfa {
        max-width: 820px;
        margin: 0 auto;
        padding: 28px 20px 56px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 28px;
      }
      .marka {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.01em;
        text-decoration: none;
      }
      .marka span {
        color: var(--muted);
        font-weight: 500;
      }
      /* Üst bant */
      .bant {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 22px;
        border-radius: 18px;
        color: #fff;
        background: var(--ok);
      }
      .bant.yavas {
        background: var(--warn);
      }
      .bant.sorun {
        background: var(--bad);
      }
      .bant.bakim {
        background: var(--maint);
      }
      .bant.bilinmiyor {
        background: #8a7f78;
      }
      .bant .nokta {
        position: relative;
        width: 14px;
        height: 14px;
        flex: none;
      }
      .bant .nokta::before,
      .bant .nokta::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #fff;
      }
      .bant .nokta::after {
        animation: nabiz 2.2s ease-out infinite;
      }
      @keyframes nabiz {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(3);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bant .nokta::after {
          animation: none;
          opacity: 0;
        }
      }
      .bant h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .bant p {
        margin: 2px 0 0;
        font-size: 14px;
        opacity: 0.92;
      }

      section {
        margin-top: 30px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kart {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }

      /* Planlı bakım */
      .planli {
        padding: 16px 20px;
        border-left: 4px solid var(--maint);
      }
      .planli + .planli {
        border-top: 1px solid var(--border);
      }
      .planli b {
        display: block;
        font-size: 15.5px;
      }
      .planli .zaman {
        color: var(--primary);
        font-weight: 600;
        font-size: 13.5px;
      }
      .planli p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      /* Bileşenler */
      .bilesen {
        padding: 16px 20px 14px;
      }
      .bilesen + .bilesen {
        border-top: 1px solid var(--border);
      }
      .bilesen .ust {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .bilesen .ad {
        font-weight: 600;
        font-size: 15.5px;
      }
      .bilesen .acik {
        color: var(--muted);
        font-size: 13px;
      }
      .rozet {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .rozet::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .rozet.calisiyor {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .rozet.yavas {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .rozet.sorun {
        color: var(--bad);
        background: var(--bad-soft);
      }
      .rozet.bakim {
        color: var(--maint);
        background: var(--maint-soft);
      }
      .rozet.bilinmiyor {
        color: var(--muted);
        background: var(--none);
      }
      .cubuklar {
        display: flex;
        gap: 2px;
        height: 30px;
        margin-top: 12px;
      }
      .cubuk {
        flex: 1;
        min-width: 2px;
        border-radius: 2px;
        background: var(--none);
      }
      .cubuk.iyi {
        background: var(--ok);
      }
      .cubuk.orta {
        background: var(--warn);
      }
      .cubuk.kotu {
        background: var(--bad);
      }
      .cubuk:hover {
        opacity: 0.7;
      }
      .alt {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .alt .oran {
        font-weight: 600;
        color: var(--fg);
      }
      .elle {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }

      /* Olaylar */
      .gun {
        padding: 14px 20px;
      }
      .gun + .gun {
        border-top: 1px solid var(--border);
      }
      .gun .tarih {
        font-weight: 600;
        font-size: 14px;
      }
      .olay {
        margin-top: 8px;
        padding-left: 12px;
        border-left: 3px solid var(--none);
      }
      .olay.sorun {
        border-color: var(--bad);
      }
      .olay.bakim {
        border-color: var(--maint);
      }
      .olay.yavas {
        border-color: var(--warn);
      }
      .olay b {
        font-size: 14.5px;
      }
      .olay .etiket {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-left: 6px;
      }
      .olay p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }
      .bos {
        padding: 18px 20px;
        color: var(--muted);
        font-size: 14px;
      }

      footer {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .aciklama {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .aciklama i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      @media (max-width: 520px) {
        .bilesen .ust {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }
        .bant h1 {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sayfa">
      <header>
        <a class="marka" href="https://xokul.co/">
          <svg width="30" height="30" viewBox="0 0 96 96" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFC6AD" />
                <stop offset="35%" stop-color="#FF9072" />
                <stop offset="75%" stop-color="#FF7E5F" />
                <stop offset="100%" stop-color="#F26A4F" />
              </linearGradient>
            </defs>
            <g transform="translate(48 48)" fill="url(#g)">
              <path transform="rotate(45)" d="M 0 0 C -10 -14, -10 -36, 0 -42 C 10 -36, 10 -14, 0 0 Z" />
              <path transform="rotate(135)" d="M 0 0 C -10 -14, -10 -36, 0 -42 C 10 -36, 10 -14, 0 0 Z" />
              <path transform="rotate(225)" d="M 0 0 C -10 -14, -10 -36, 0 -42 C 10 -36, 10 -14, 0 0 Z" />
              <path transform="rotate(315)" d="M 0 0 C -10 -14, -10 -36, 0 -42 C 10 -36, 10 -14, 0 0 Z" />
              <circle r="5" fill="#FFE1D2" />
            </g>
          </svg>
          xokul <span>durum</span>
        </a>
      </header>

      <div id="bant" class="bant bilinmiyor" role="status" aria-live="polite">
        <span class="nokta" aria-hidden="true"></span>
        <div>
          <h1 id="bant-baslik">Durum yükleniyor…</h1>
          <p id="bant-alt"></p>
        </div>
      </div>

      <section id="planli-bolum" hidden>
        <h2>Planlı bakım</h2>
        <div class="kart" id="planli"></div>
      </section>

      <section>
        <h2>Sistemler</h2>
        <div class="kart" id="bilesenler"></div>
        <div class="aciklama">
          <span><i style="background: var(--ok)"></i>Sorunsuz gün</span>
          <span><i style="background: var(--warn)"></i>Kısa kesinti</span>
          <span><i style="background: var(--bad)"></i>Uzun kesinti</span>
          <span><i style="background: var(--none)"></i>Ölçüm yok</span>
        </div>
      </section>

      <section>
        <h2>Son 30 günün olayları</h2>
        <div class="kart" id="olaylar"></div>
      </section>

      <footer>
        <span id="son-yoklama"></span>
        <span>Sayfa dakikada bir kendiliğinden yenilenir.</span>
      </footer>
    </div>

    <script>
      (function () {
        'use strict';

        // ---------------------------------------------------------------
        // Ayarlar
        // ---------------------------------------------------------------
        var DURUM_URL = 'durum.json';
        var GECMIS_URL = 'https://raw.githubusercontent.com/onusmustafa/xokul-durum/veri/gecmis.json';
        var GUN_SAYISI = 90;
        // Otomatik ölçüm bu kadar eskiyse (dk) anlık durumda KULLANILMAZ.
        var BAYAT_DK = 30;

        /**
         * Gösterilen sistemler. `olc`: yokla.mjs'teki ölçüm anahtarları; boşsa
         * yalnız elle yönetilir (durum.json > bilesenler).
         */
        var BILESENLER = [
          { k: 'mobil', ad: 'Mobil uygulama', acik: 'Giriş, mesajlar, teslim, yoklama', olc: ['mobil', 'veritabani'] },
          { k: 'panel', ad: 'Web paneli', acik: 'Okul yönetim paneli', olc: ['panel', 'veritabani'] },
          { k: 'bildirim', ad: 'Bildirimler', acik: 'Telefona gelen anlık bildirimler', olc: ['panel'] },
          { k: 'medya', ad: 'Fotoğraf ve video', acik: 'Yükleme ve görüntüleme', olc: ['medya'] },
          { k: 'sms', ad: 'SMS', acik: 'Veli bilgilendirme mesajları', olc: [] },
          { k: 'site', ad: 'Web sitesi', acik: 'xokul.co', olc: ['site'] },
        ];

        var ETIKET = {
          calisiyor: 'Çalışıyor',
          yavas: 'Yavaşlama',
          sorun: 'Kesinti',
          bakim: 'Bakımda',
          bilinmiyor: 'Ölçülemiyor',
        };
        // Kötüden iyiye: birden çok kaynaktan en kötüsü gösterilir.
        var SIRA = ['sorun', 'bakim', 'yavas', 'bilinmiyor', 'calisiyor'];

        // ---------------------------------------------------------------
        // Yardımcılar
        // ---------------------------------------------------------------
        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        }
        function kotusu(a, b) {
          return SIRA.indexOf(a) <= SIRA.indexOf(b) ? a : b;
        }
        var TR = 'tr-TR';
        var TZ = { timeZone: 'Europe/Istanbul' };
        function gunAnahtari(d) {
          return new Intl.DateTimeFormat('en-CA', TZ).format(d);
        }
        function gunYazi(anahtar) {
          var d = new Date(anahtar + 'T12:00:00+03:00');
          return d.toLocaleDateString(TR, { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long', timeZone: 'Europe/Istanbul' });
        }
        function saat(iso) {
          return new Date(iso).toLocaleTimeString(TR, { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul' });
        }
        function tarihSaat(iso) {
          return new Date(iso).toLocaleString(TR, { day: 'numeric', month: 'long', weekday: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul' });
        }
        function sure(ms) {
          var dk = Math.max(1, Math.round(ms / 60000));
          if (dk < 60) return dk + ' dakika';
          var s = Math.floor(dk / 60);
          var k = dk % 60;
          return s + ' saat' + (k ? ' ' + k + ' dakika' : '');
        }
        function gecerliTarih(v) {
          return typeof v === 'string' && isFinite(Date.parse(v));
        }
        function yazi(v, sinir) {
          return typeof v === 'string' && v.trim() ? v.trim().slice(0, sinir || 400) : '';
        }

        /** Uygulamalardaki kuralın aynısı: bakım şu an geçerli mi? */
        function bakimVar(d, simdi) {
          if (!d || d.bakim !== true) return false;
          if (typeof d.baslangic === 'string') {
            var b = Date.parse(d.baslangic);
            if (!isFinite(b) || simdi < b) return false;
          }
          return true;
        }

        function getir(url) {
          var ayrac = url.indexOf('?') === -1 ? '?' : '&';
          return fetch(url + ayrac + 't=' + Math.floor(Date.now() / 30000), { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            });
        }

        // ---------------------------------------------------------------
        // Çizim
        // ---------------------------------------------------------------
        function ciz(durum, gecmis) {
          var simdi = Date.now();
          durum = durum && typeof durum === 'object' ? durum : {};
          gecmis = gecmis && typeof gecmis === 'object' ? gecmis : {};
          var bakim = bakimVar(durum, simdi);
          var guncel = gecmis.guncel && gecmis.guncel.bilesenler ? gecmis.guncel : null;
          var taze = !!guncel && gecerliTarih(guncel.zaman) && simdi - Date.parse(guncel.zaman) < BAYAT_DK * 60000;
          var elle = durum.bilesenler && typeof durum.bilesenler === 'object' ? durum.bilesenler : {};
          var gunler = gecmis.gunler && typeof gecmis.gunler === 'object' ? gecmis.gunler : {};

          // --- Sistemler
          var kutu = document.getElementById('bilesenler');
          kutu.textContent = '';
          var genel = 'calisiyor';
          var olculen = 0;

          BILESENLER.forEach(function (b) {
            // Anlık durum: elle yazılan + otomatik ölçüm, en kötüsü.
            var d = null;
            var ms = null;
            if (taze) {
              b.olc.forEach(function (o) {
                var g = guncel.bilesenler[o];
                if (!g || g.durum === 'bilinmiyor') return;
                d = kotusu(d || 'calisiyor', g.durum === 'kapali' ? 'sorun' : 'calisiyor');
                if (typeof g.ms === 'number') ms = Math.max(ms || 0, g.ms);
              });
            }
            if (d) olculen++;
            var e = elle[b.k];
            if (SIRA.indexOf(e) !== -1) d = d ? kotusu(d, e) : e;
            if (bakim && b.k !== 'site') d = d === 'sorun' ? 'bakim' : kotusu(d || 'bakim', 'bakim');
            // Ölçümü olmayan ve elle de yazılmamış sistem "çalışıyor" sayılır.
            if (!d) d = b.olc.length === 0 ? 'calisiyor' : 'bilinmiyor';
            if (d !== 'bilinmiyor') genel = kotusu(genel, d);

            var satir = el('div', 'bilesen');
            var ust = el('div', 'ust');
            var sol = el('div');
            sol.appendChild(el('div', 'ad', b.ad));
            sol.appendChild(el('div', 'acik', b.acik));
            ust.appendChild(sol);
            ust.appendChild(el('span', 'rozet ' + d, ETIKET[d] + (d === 'calisiyor' && ms ? ' · ' + ms + ' ms' : '')));
            satir.appendChild(ust);

            if (b.olc.length === 0) {
              satir.appendChild(el('div', 'elle', 'Bu sistem otomatik ölçülmüyor; bir sorun olduğunda buradan duyurulur.'));
            } else {
              var cub = el('div', 'cubuklar');
              var topT = 0;
              var topH = 0;
              for (var i = GUN_SAYISI - 1; i >= 0; i--) {
                var anahtar = gunAnahtari(new Date(simdi - i * 86400000));
                var t = 0;
                var h = 0;
                var gun = gunler[anahtar] || {};
                b.olc.forEach(function (o) {
                  if (gun[o]) {
                    t += gun[o].t || 0;
                    h += gun[o].h || 0;
                  }
                });
                var c = el('div', 'cubuk');
                var baslik = gunYazi(anahtar) + ': ';
                if (t === 0) {
                  baslik += 'ölçüm yok';
                } else {
                  topT += t;
                  topH += h;
                  var oran = h / t;
                  c.className += oran === 0 ? ' iyi' : oran < 0.05 ? ' orta' : ' kotu';
                  baslik += oran === 0 ? 'kesinti yok' : 'ölçümlerin %' + (oran * 100).toFixed(1).replace('.', ',') + "'i başarısız";
                }
                c.title = baslik;
                cub.appendChild(c);
              }
              satir.appendChild(cub);
              var alt = el('div', 'alt');
              alt.appendChild(el('span', null, GUN_SAYISI + ' gün önce'));
              alt.appendChild(
                el(
                  'span',
                  'oran',
                  topT === 0 ? 'Henüz ölçüm yok' : 'Erişilebilirlik %' + ((1 - topH / topT) * 100).toFixed(2).replace('.', ','),
                ),
              );
              alt.appendChild(el('span', null, 'Bugün'));
              satir.appendChild(alt);
            }
            kutu.appendChild(satir);
          });

          // --- Üst bant
          var bant = document.getElementById('bant');
          var baslik = document.getElementById('bant-baslik');
          var altYazi = document.getElementById('bant-alt');
          var ozel = yazi(durum.mesaj);
          var sinif = genel;
          var metin;
          var alt = '';
          if (bakim) {
            sinif = 'bakim';
            metin = 'Bakım çalışması yapılıyor';
            alt = ozel || "xokul'u sizin için daha hızlı ve daha güvenli hale getiriyoruz. Kısa süre sonra yeniden hizmetinizdeyiz.";
          } else if (genel === 'sorun') {
            metin = 'Bazı sistemlerde kesinti var';
            alt = ozel || 'Ekibimiz konunun farkında ve üzerinde çalışıyor.';
          } else if (genel === 'yavas') {
            metin = 'Bazı sistemlerde yavaşlama var';
            alt = ozel || 'Sistemler çalışıyor ancak beklenenden yavaş yanıt veriyor.';
          } else if (genel === 'bakim') {
            sinif = 'bakim';
            metin = 'Bazı sistemler bakımda';
            alt = ozel;
          } else if (olculen === 0 && !taze) {
            // Otomatik ölçüm yok/bayat ve elle bir sorun yazılmamış.
            sinif = 'calisiyor';
            metin = 'Bildirilen bir sorun yok';
            alt = ozel || 'Otomatik ölçüm şu an alınamıyor; bilinen bir kesinti bulunmuyor.';
          } else {
            metin = 'Tüm sistemler çalışıyor';
            alt = ozel;
          }
          bant.className = 'bant ' + sinif;
          baslik.textContent = metin;
          altYazi.textContent = alt;
          altYazi.hidden = !alt;
          document.title = 'xokul | ' + metin;

          // --- Planlı bakım (bitmemiş olanlar)
          var planli = (Array.isArray(durum.planli) ? durum.planli : [])
            .filter(function (p) {
              if (!p || !gecerliTarih(p.baslangic)) return false;
              var bitis = gecerliTarih(p.bitis) ? Date.parse(p.bitis) : Date.parse(p.baslangic) + 6 * 3600000;
              return bitis > simdi;
            })
            .sort(function (a, b) {
              return Date.parse(a.baslangic) - Date.parse(b.baslangic);
            });
          var pk = document.getElementById('planli');
          pk.textContent = '';
          planli.forEach(function (p) {
            var d = el('div', 'planli');
            var z = tarihSaat(p.baslangic);
            if (gecerliTarih(p.bitis)) z += ' - ' + saat(p.bitis);
            d.appendChild(el('span', 'zaman', z));
            d.appendChild(el('b', null, yazi(p.baslik, 120) || 'Planlı bakım'));
            if (yazi(p.aciklama)) d.appendChild(el('p', null, yazi(p.aciklama, 600)));
            pk.appendChild(d);
          });
          document.getElementById('planli-bolum').hidden = planli.length === 0;

          // --- Olaylar: elle yazılanlar + otomatik saptanan kesintiler
          var olaylar = [];
          var ADI = {};
          BILESENLER.forEach(function (b) {
            b.olc.forEach(function (o) {
              if (!ADI[o]) ADI[o] = b.ad;
            });
          });
          ADI.veritabani = 'Veritabanı';
          (Array.isArray(durum.olaylar) ? durum.olaylar : []).forEach(function (o) {
            if (!o || !gecerliTarih(o.tarih)) return;
            olaylar.push({
              zaman: Date.parse(o.tarih),
              tur: SIRA.indexOf(o.tur) !== -1 ? o.tur : 'sorun',
              baslik: yazi(o.baslik, 140) || 'Olay',
              etiket: yazi(o.durum, 40),
              aciklama: yazi(o.aciklama, 800),
            });
          });
          (Array.isArray(gecmis.kesinti) ? gecmis.kesinti : []).forEach(function (k) {
            if (!k || !gecerliTarih(k.baslangic)) return;
            var b = Date.parse(k.baslangic);
            var bit = gecerliTarih(k.bitis) ? Date.parse(k.bitis) : null;
            olaylar.push({
              zaman: b,
              tur: 'sorun',
              baslik: (ADI[k.bilesen] || k.bilesen) + ': erişim kesintisi',
              etiket: bit ? 'Çözüldü' : 'Sürüyor',
              aciklama: bit
                ? saat(k.baslangic) + ' - ' + saat(k.bitis) + ' arasında yaklaşık ' + sure(bit - b) + ' erişilemedi (otomatik ölçüm).'
                : saat(k.baslangic) + ' itibarıyla erişilemiyor (otomatik ölçüm).',
            });
          });
          var esik = simdi - 30 * 86400000;
          olaylar = olaylar
            .filter(function (o) {
              return o.zaman >= esik && o.zaman <= simdi + 60000;
            })
            .sort(function (a, b) {
              return b.zaman - a.zaman;
            });

          var ok = document.getElementById('olaylar');
          ok.textContent = '';
          if (olaylar.length === 0) {
            ok.appendChild(el('div', 'bos', 'Son 30 günde kayıtlı bir olay yok.'));
          } else {
            var sonGun = null;
            var gunKutu = null;
            olaylar.forEach(function (o) {
              var g = gunAnahtari(new Date(o.zaman));
              if (g !== sonGun) {
                sonGun = g;
                gunKutu = el('div', 'gun');
                gunKutu.appendChild(el('div', 'tarih', gunYazi(g)));
                ok.appendChild(gunKutu);
              }
              var d = el('div', 'olay ' + o.tur);
              var b = el('b', null, o.baslik);
              d.appendChild(b);
              if (o.etiket) d.appendChild(el('span', 'etiket', o.etiket));
              if (o.aciklama) d.appendChild(el('p', null, o.aciklama));
              gunKutu.appendChild(d);
            });
          }

          // --- Alt bilgi
          document.getElementById('son-yoklama').textContent =
            guncel && gecerliTarih(guncel.zaman)
              ? 'Son otomatik ölçüm: ' + tarihSaat(guncel.zaman) + (taze ? '' : ' (güncel değil)')
              : 'Otomatik ölçüm henüz yok.';
        }

        function yenile() {
          Promise.all([getir(DURUM_URL), getir(GECMIS_URL)]).then(function (s) {
            ciz(s[0], s[1]);
          });
        }
        yenile();
        setInterval(yenile, 60000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') yenile();
        });
      })();
    </script>
  </body>
</html>
