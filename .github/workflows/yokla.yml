# xokul durum sitesi: sistemleri 5 dakikada bir yoklar, sonucu `veri` dalındaki
# gecmis.json dosyasına yazar. Sayfa (index.html) o dosyayı okur.
#
# Neden ayrı dal: her yoklamada `main` değişirse GitHub Pages siteyi saatte 12
# kez yeniden kurar (sınır 10). `veri` dalı Pages kaynağı değildir, site
# yalnız siz durum.json'u değiştirdiğinizde yeniden kurulur.
#
# `veri` dalında TEK commit tutulur (her seferinde üzerine yazılır): depo
# büyümez.
name: yokla

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yokla
  cancel-in-progress: false

jobs:
  yokla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: kaynak

      - name: veri dalını al
        env:
          DEPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --quiet --depth 1 --branch veri "$DEPO" veri 2>/dev/null; then
            echo "veri dalı alındı"
          else
            echo "veri dalı yok, oluşturuluyor"
            mkdir veri && cd veri
            git init --quiet -b veri
            git remote add origin "$DEPO"
          fi

      - name: yokla
        run: node kaynak/yokla.mjs veri/gecmis.json

      - name: sonucu yaz
        working-directory: veri
        run: |
          git config user.name "xokul-durum"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gecmis.json
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            git commit --quiet --amend -m "yoklama"
          else
            git commit --quiet -m "yoklama"
          fi
          git push --quiet --force origin veri
